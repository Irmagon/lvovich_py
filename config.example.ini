; Пример конфигурации сервера fioincline.
; Скопируйте этот файл в config.ini и отредактируйте под свой запуск.
;
; Параметры, которых нет в config.ini, берутся из значений по умолчанию
; (см. fioincline/config.py).

[server]
; адрес и порт, на которых слушает uvicorn
address = 0.0.0.0
port = 3000
; включать ли автодокументацию FastAPI (/api-docs, /openapi.json, /redoc)
swagger = true

[auth]
; токен для REST/SOAP (заголовок Authorization: Bearer <token>).
; Пусто = аутентификация выключена.
token =
; список разрешённых IP через запятую; пусто = разрешить все.
allowed_ips = 127.0.0.1, ::1

[logging]
; вести ли лог запросов в server.log (true/false)
enabled = true
; режим записи лога: async (по умолчанию) или sync
mode = async
; интервал сброса буфера на диск, мс (только async)
flush_ms = 50
; порог объёма буфера для внепланового сброса, КБ (только async)
buffer_kb = 64
